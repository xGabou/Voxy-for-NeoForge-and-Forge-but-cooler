plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

tasks.named('wrapper', Wrapper).configure {
    // Keep the wrapper on the binary distribution to avoid pulling Gradle docs sources.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

project.ext.lwjglVersion = "3.3.3"

sourceSets {
    main {
        resources {
            srcDir('src/generated/resources')
            exclude("**/*.bbmodel")
            exclude("src/generated/**/.cache")
        }
        java {
            // Optional config UI hooks not shipped in this build.
            exclude 'me/cortex/voxy/client/config/SodiumConfigBuilder.java'
            exclude 'me/cortex/voxy/client/config/VoxyConfigMenu.java'
            exclude 'me/cortex/voxy/client/config/IConfigPageSetter.java'

            exclude 'me/cortex/voxy/client/config/ModMenuIntegration.java'

            exclude 'me/cortex/voxy/client/mixin/flashback/**'
            exclude 'me/cortex/voxy/client/mixin/nvidium/**'

            // Debug screen and OpenGL debug hooks are not part of the NeoForge 1.21.1 build.
            exclude 'me/cortex/voxy/client/VoxyDebugScreenEntry.java'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinDebugScreenEntryList.java'
            exclude 'me/cortex/voxy/client/mixin/sodium/MixinVideoSettingsScreen.java'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinGlDebug.java'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinBlockableEventLoop.java'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://cursemaven.com"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }



    exclusiveContent {
        forRepository {
            maven {
                name = "CaffeineMC"
                url = "https://maven.caffeinemc.net/snapshots"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }

    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }

    exclusiveContent {
        forRepository {
            ivy {
                name = "github"
                url = "https://github.com/"
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex("[^\\.]+", "nvidium")
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Access transformers are still used in this build.
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

// Default run configurations.
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        dependencies {
            runtime 'org.rocksdb:rocksdbjni:10.2.1'
            runtime 'redis.clients:jedis:5.1.0'
            runtime 'org.tukaani:xz:1.10'
            runtime 'org.xerial:sqlite-jdbc:3.49.1.0'
            runtime "org.lwjgl:lwjgl-lmdb:$lwjglVersion"
            runtime "org.lwjgl:lwjgl-zstd:$lwjglVersion"
            runtime "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
            runtime "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
            runtime "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
            runtime "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"
        }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    data {
        arguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "curse.maven:simple-clouds-1121215:6928979"
    implementation "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    implementation("maven.modrinth:lithium:mc1.21.1-0.15.1-neoforge")
    compileOnly "curse.maven:oculus-581495:6020952"

    // Native runtime and bundled libraries
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    jarJar(implementation("org.lwjgl:lwjgl-lmdb:$lwjglVersion")) {
        version { strictly "[3.3.0,4.0.0)"; prefer "$lwjglVersion" }
    }
    jarJar(implementation("org.lwjgl:lwjgl-zstd:$lwjglVersion")) {
        version { strictly "[3.3.0,4.0.0)"; prefer "$lwjglVersion" }
    }
    localRuntime "org.lwjgl:lwjgl-lmdb:$lwjglVersion"
    localRuntime "org.lwjgl:lwjgl-zstd:$lwjglVersion"
    localRuntime "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    localRuntime "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    localRuntime "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    localRuntime "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"

    // Bundled server-side storage and import dependencies.
    jarJar(implementation('org.rocksdb:rocksdbjni')) {
        version {
            strictly '[10.0.0, 11.0.0)'
            prefer '10.2.1'
        }
    }
    localRuntime 'org.rocksdb:rocksdbjni:10.2.1'
    implementation 'org.lz4:lz4-java:1.8.0'
    jarJar(implementation('redis.clients:jedis:5.1.0')) {
        version {
            strictly '[5.0.0, 6.0.0)'
            prefer '5.1.0'
        }
    }
    localRuntime 'redis.clients:jedis:5.1.0'
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    jarJar(implementation('org.tukaani:xz:1.10')) {
        version {
            strictly '[1.9, 2.0)'
            prefer '1.10'
        }
    }
    localRuntime 'org.tukaani:xz:1.10'
    jarJar(implementation('org.xerial:sqlite-jdbc:3.49.1.0')) {
        version {
            strictly '[3.40.0.0, 4.0.0.0)'
            prefer '3.49.1.0'
        }
    }
    localRuntime 'org.xerial:sqlite-jdbc:3.49.1.0'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}"}
    }
}

tasks.named('jar').configure {
    archiveClassifier = 'thin'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
}

tasks.register('validateMixins') {
    dependsOn jar

    description = 'Validates that all mixins declared in JSON configs are present in the JAR'
    group = 'verification'

    doLast {
        def mixinConfigs = new ArrayList<File>()
        fileTree('src/main/resources') {
            include '**/*.mixins.json'
        }.files.each { File file ->
            mixinConfigs.add(file)
        }
        java.util.Collections.sort(mixinConfigs, new Comparator<File>() {
            @Override
            int compare(File a, File b) {
                return a.path.compareTo(b.path)
            }
        })

        if (mixinConfigs.isEmpty()) {
            logger.lifecycle('No mixin configuration files found; skipping mixin validation.')
            return
        }

        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("No JAR file found at ${jarFile}")
        }

        def jarEntries = new HashSet<String>()
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zipFile.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                jarEntries.add(entry.name)
            }
        } finally {
            zipFile.close()
        }

        def slurper = new groovy.json.JsonSlurper()
        def totalMixins = 0
        def errors = []

        println '=== MIXIN CONFIGURATION VALIDATION ==='
        println()

        for (File jsonFile : mixinConfigs) {
            def configName = jsonFile.name
            println "Checking ${configName}..."

            def parsed
            try {
                parsed = slurper.parse(jsonFile)
            } catch (Exception e) {
                errors << "${configName}: invalid JSON syntax (${e.message})"
                println '  FAIL: Invalid JSON syntax'
                println()
                return
            }

            def packageName = parsed.package
            if (!packageName) {
                errors << "${configName}: missing package declaration"
                println '  FAIL: Missing package declaration'
                println()
                return
            }

            for (String arrayType : ['mixins', 'client', 'server']) {
                def mixins = parsed[arrayType]
                if (mixins instanceof Collection && !mixins.isEmpty()) {
                    println "  Validating .${arrayType}[]..."

                    for (def mixin : mixins) {
                        if (mixin) {
                            totalMixins++

                            def classPath = ("${packageName.replace('.', '/')}/${mixin.replace('.', '/')}.class").toString()
                            if (jarEntries.contains(classPath)) {
                                println "    PASS ${mixin}"
                            } else {
                                errors.add("${configName}: missing ${mixin} (${classPath})")
                                println "    FAIL ${mixin}"
                                println "      Expected: ${classPath}"
                                println '      Status: NOT FOUND IN JAR'
                            }
                        }
                    }
                }
            }

            println()
        }

        println '=== VALIDATION SUMMARY ==='
        println "Total mixins checked: ${totalMixins}"
        println "JAR file: ${jarFile.name}"
        println "JAR size: ${jarFile.length()}"
        println()

        if (errors.isEmpty()) {
            println 'PASS: ALL CHECKS PASSED'
            println 'All mixin references are valid and present in JAR'
        } else {
            println 'FAIL: VALIDATION FAILED'
            println "Found ${errors.size()} phantom mixin reference(s)"
            println()
            println 'These mixins are declared in JSON configs but missing from the JAR.'
            println 'This will cause ClassNotFoundException at runtime.'
            println()
            println 'Common causes:'
            println '  1. Mixin class excluded from compilation (check build.gradle sourceSets)'
            println '  2. Mixin class deleted but not removed from JSON'
            println '  3. Typo in mixin class name'
            for (String error : errors) {
                logger.error(error)
            }
            throw new GradleException('Mixin validation failed')
        }
    }
}

build.dependsOn tasks.named('validateMixins')

// Configuration to download LWJGL natives for repackaging
configurations {
    lwjglNativesRaw
}

dependencies {
    // Download natives for repackaging (module-info.class will be stripped)
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"
}

// Task to extract LWJGL native binaries (DLLs/SOs) from native JARs
// LWJGL can load natives from the classpath root - no module-info.class issues
def extractedNativesDir = layout.buildDirectory.dir("extracted-natives")

tasks.register('extractLwjglNatives') {
    description = 'Extracts native binaries from LWJGL native JARs for bundling'
    group = 'build'

    inputs.files(configurations.lwjglNativesRaw)
    outputs.dir(extractedNativesDir)

    doLast {
        def outputDir = extractedNativesDir.get().asFile
        outputDir.mkdirs()

        configurations.lwjglNativesRaw.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def inputJar = artifact.file
            logger.lifecycle("Extracting natives from ${inputJar.name}")

            // Extract only native binaries (.dll, .so, .dylib)
            copy {
                from(zipTree(inputJar)) {
                    include '**/*.dll'
                    include '**/*.so'
                    include '**/*.dylib'
                    // Flatten directory structure - put all natives at root
                    eachFile { fcp ->
                        fcp.relativePath = new RelativePath(true, fcp.name)
                    }
                    includeEmptyDirs = false
                }
                into outputDir
            }
        }

        // List extracted files
        outputDir.listFiles()?.each { file ->
            logger.lifecycle("  Extracted: ${file.name}")
        }
    }
}

// Include extracted natives in the mod JAR root
// LWJGL will find them there when the mod JAR is on the classpath
tasks.named('jar') {
    dependsOn 'extractLwjglNatives'

    from(extractedNativesDir) {
        // Natives at JAR root for LWJGL to find
        into ''
    }
}
